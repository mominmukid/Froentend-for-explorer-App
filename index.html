<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Images/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wideview - Share and explore amazing videos from creators worldwide" />
  <meta name="theme-color" content="#ef4444" />
  <title>Wideview</title>
  <style>
    #preloader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8f9fc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {
      #preloader-container {
        background: #1a1c1e;
      }
    }

    .preloader-logo {
      width: 80px;
      height: auto;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .preloader-text {
      margin-top: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
      letter-spacing: 0.5px;
    }

    @media (prefers-color-scheme: dark) {
      .preloader-text {
        color: #9ca3af;
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="preloader-container">
      <img src="/Images/logo.png" alt="Wideview" class="preloader-logo" />
      <span class="preloader-text">Loading Wideview...</span>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
